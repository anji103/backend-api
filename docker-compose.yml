
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ohmind_app:latest
    container_name: ohmind_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - postgres
      - redis

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ohmind_postgres
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ohmind_redis
    restart: unless-stopped
