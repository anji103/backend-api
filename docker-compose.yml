
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ohmind_app
    image: ohmind_app:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ohmind_net

  postgres:
    image: postgres:16-alpine
    container_name: ohmind_postgres
    environment:
      POSTGRES_USER: ohmind
      POSTGRES_PASSWORD: ohmind_secret
      POSTGRES_DB: ohmind_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ohmind -d ohmind_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - ohmind_net

  redis:
    image: redis:7-alpine
    container_name: ohmind_redis
    ports:
      - "6383:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - ohmind_net

volumes:
  postgres_data:
  redis_data:

networks:
  ohmind_net:
    driver: bridge
