
services:
  # Application
  app:
    image: anji103/backend-api:latest
    container_name: ohmind_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ohmind_net

  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: ohmind_postgres
    environment:
      POSTGRES_USER: ohmind
      POSTGRES_PASSWORD: ohmind_secret
      POSTGRES_DB: ohmind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ohmind -d ohmind_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - ohmind_net

  # Redis
  redis:
    image: redis:7-alpine
    container_name: ohmind_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - ohmind_net

volumes:
  postgres_data:
  redis_data:

networks:
  ohmind_net:
    driver: bridge
